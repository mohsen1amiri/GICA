[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gica"
version = "1.0.0"
description = "GICA: Gap-Index Compositional Arm framework for sample-efficient test-time scaling"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
